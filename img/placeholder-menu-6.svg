<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E563A"/>
      <stop offset="60%" stop-color="#0B4A32"/>
      <stop offset="100%" stop-color="#06301F"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4A93C"/>
      <stop offset="100%" stop-color="#8A6A14"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle border pattern -->
  <rect x="20" y="20" width="560" height="410" rx="16" fill="none" stroke="url(#goldG)" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="28" y="28" width="544" height="394" rx="12" fill="none" stroke="rgba(212,169,60,0.3)" stroke-width="1"/>

  <!-- Banana Leaf Icon -->
  <g transform="translate(300, 180) scale(1.1)">
    <!-- Plate circle -->
    <circle cx="0" cy="0" r="85" fill="#06301F" stroke="url(#goldG)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(242,140,27,0.4)" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Stylized Banana Leaf -->
    <path d="M -50,-10 C -40,-45 20,-45 50,-10 C 20,40 -40,40 -50,-10 Z" fill="#2E7D32" stroke="#81C784" stroke-width="2"/>
    <line x1="-50" y1="-10" x2="50" y2="-10" stroke="#C8E6C9" stroke-width="2"/>
    
    <!-- Food dots -->
    <circle cx="-15" cy="-22" r="7" fill="#F28C1B"/>
    <circle cx="15" cy="-22" r="7" fill="#FFF6E0"/>
    <circle cx="0" cy="15" r="9" fill="#D4A93C"/>
    
    <!-- Veg Symbol -->
    <rect x="-8" y="45" width="16" height="16" fill="#FFF" stroke="#2E7D32" stroke-width="1.5" rx="2"/>
    <circle cx="0" cy="53" r="4" fill="#2E7D32"/>
  </g>

  <!-- Titles -->
  <text x="300" y="325" text-anchor="middle" font-family="'Baloo Tamma 2', 'Noto Sans Kannada', sans-serif" font-weight="700" font-size="28" fill="#FFF6E0">ಸಂಜೆ ಸ್ನ್ಯಾಕ್ಸ್ & ಕಾಫಿ</text>
  <text x="300" y="360" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="19" fill="#F0D27A">Evening Snacks</text>
  <text x="300" y="390" text-anchor="middle" font-family="'Anek Kannada', sans-serif" font-size="14" fill="#81C784">100% ಶುದ್ಧ ಸಸ್ಯಾಹಾರಿ • ಶ್ರೀ ಅನ್ನಪೂರ್ಣೇಶ್ವರಿ ಕೇಟರಿಂಗ್</text>
</svg>