<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" opacity="0.15">
  <g stroke="#D4AF37" stroke-width="0.5">
    <!-- Outer rings -->
    <circle cx="200" cy="200" r="190"/>
    <circle cx="200" cy="200" r="170"/>
    <circle cx="200" cy="200" r="150"/>
    <circle cx="200" cy="200" r="130"/>
    <circle cx="200" cy="200" r="110"/>
    <circle cx="200" cy="200" r="90"/>
    <circle cx="200" cy="200" r="70"/>
    <circle cx="200" cy="200" r="50"/>
    <circle cx="200" cy="200" r="30"/>
    
    <!-- Petals layer 1 -->
    <g transform="translate(200,200)">
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(30)"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(60)"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(90)"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(120)"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(150)"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(180)"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(210)"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(240)"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(270)"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(300)"/>
      <path d="M0,-180 Q30,-90 0,0 Q-30,-90 0,-180Z" transform="rotate(330)"/>
    </g>
    
    <!-- Petals layer 2 -->
    <g transform="translate(200,200)">
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(15)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(45)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(75)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(105)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(135)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(165)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(195)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(225)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(255)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(285)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(315)"/>
      <path d="M0,-130 Q20,-65 0,0 Q-20,-65 0,-130Z" transform="rotate(345)"/>
    </g>
    
    <!-- Inner star -->
    <g transform="translate(200,200)">
      <line x1="0" y1="-80" x2="0" y2="80"/>
      <line x1="0" y1="-80" x2="0" y2="80" transform="rotate(30)"/>
      <line x1="0" y1="-80" x2="0" y2="80" transform="rotate(60)"/>
      <line x1="0" y1="-80" x2="0" y2="80" transform="rotate(90)"/>
      <line x1="0" y1="-80" x2="0" y2="80" transform="rotate(120)"/>
      <line x1="0" y1="-80" x2="0" y2="80" transform="rotate(150)"/>
    </g>
    
    <!-- Center lotus -->
    <g transform="translate(200,200)">
      <path d="M0,-40 Q10,-20 0,0 Q-10,-20 0,-40Z"/>
      <path d="M0,-40 Q10,-20 0,0 Q-10,-20 0,-40Z" transform="rotate(45)"/>
      <path d="M0,-40 Q10,-20 0,0 Q-10,-20 0,-40Z" transform="rotate(90)"/>
      <path d="M0,-40 Q10,-20 0,0 Q-10,-20 0,-40Z" transform="rotate(135)"/>
      <path d="M0,-40 Q10,-20 0,0 Q-10,-20 0,-40Z" transform="rotate(180)"/>
      <path d="M0,-40 Q10,-20 0,0 Q-10,-20 0,-40Z" transform="rotate(225)"/>
      <path d="M0,-40 Q10,-20 0,0 Q-10,-20 0,-40Z" transform="rotate(270)"/>
      <path d="M0,-40 Q10,-20 0,0 Q-10,-20 0,-40Z" transform="rotate(315)"/>
    </g>
    
    <circle cx="200" cy="200" r="10" fill="#D4AF37" fill-opacity="0.3"/>
  </g>
</svg>
